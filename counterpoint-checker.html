<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>2声対位法チェッカー</title>
</head>
<body>
  <h1>2声対位法チェッカー</h1>

  <p>第一種対位法、1音対1音の練習ページです。</p>

  <label>定旋律</label><br>
  <textarea id="cantus" rows="3" cols="60">C4 D4 E4 F4 G4 F4 E4 D4 C4</textarea>

  <br><br>

  <label>対旋律</label><br>
  <textarea id="counterpoint" rows="3" cols="60">G4 A4 C5 B4 D5 C5 B4 A4 C5</textarea>

  <br><br>

  <button onclick="analyzeCounterpoint()">解析する</button>

  <h2>解析結果</h2>
  <div id="result"></div>

  <script>
    function analyzeCounterpoint() {
      document.getElementById("result").innerHTML = "ここに解析結果を表示します。";
    }
  </script>
</body>
</html>
