<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>第一種2声対位法チェッカー｜Atelier Composition Son</title>
  <meta name="description" content="第一種2声対位法の協和音程、連続5度、連続8度を確認するオンラインチェッカーです。" />

  <link rel="stylesheet" href="css/style.css" />
</head>

<body>
  <main class="page">
    <header class="checker-header">
      <a class="back-link" href="index.html">← トップへ戻る</a>
      <p class="eyebrow">First Species Counterpoint</p>
      <h1>第一種2声対位法チェッカー</h1>
      <p class="lead">
        五線譜をクリックして対旋律を入力します。定旋律と対旋律をもとに、協和音程、連続5度、連続8度を確認します。
      </p>
    </header>

    <section class="checker-panel">
      <!-- 解析用。画面には表示しません -->
      <textarea id="cantus" class="hidden-input">C4 D4 E4 F4 G4 F4 E4 D4 C4</textarea>
      <textarea id="counterpoint" class="hidden-input"></textarea>

      <div class="score-tools">
        <button class="button small" type="button" onclick="setExample()">
          例題を読み込む
        </button>
        <button class="button small" type="button" onclick="undoCounterpointNote()">
          最後の音を削除
        </button>
        <button class="button small" type="button" onclick="clearCounterpoint()">
          対旋律をクリア
        </button>
        <button class="button small" type="button" onclick="renderScore()">
          楽譜を更新
        </button>
      </div>

      <div class="score-box">
        <div class="score-head">
          <div>
            <h2>五線入力</h2>
            <p>上の五線をクリックすると、対旋律を入力できます。</p>
          </div>
          <div class="score-status" id="scoreStatus">
            対旋律：0音
          </div>
        </div>

        <svg
          id="scoreEditor"
          class="score-editor"
          viewBox="0 0 960 300"
          role="img"
          aria-label="対位法入力用五線譜"
        ></svg>
      </div>

      <div class="current-notes">
        <h2>現在の入力</h2>
        <p><strong>定旋律：</strong><span id="cantusDisplay"></span></p>
        <p><strong>対旋律：</strong><span id="counterpointDisplay"></span></p>
      </div>

      <button class="button primary" onclick="analyzeCounterpoint()">
        解析する
      </button>
    </section>

    <section class="result-section">
      <h2>解析結果</h2>
      <div id="summary" class="summary-box">
        まだ解析していません。
      </div>
      <div id="result" class="result-list"></div>
    </section>
  </main>

  <script src="js/counterpoint.js"></script>
</body>
</html>
