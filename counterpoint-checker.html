<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>第一種2声対位法チェッカー｜Atelier Composition Son</title>
  <meta name="description" content="第一種2声対位法の協和音程、連続5度、連続8度を確認するオンラインチェッカーです。" />

  <link rel="stylesheet" href="css/style.css" />
</head>

<body>
  <main class="page">
    <header class="checker-header">
      <a class="back-link" href="index.html">← トップへ戻る</a>
      <p class="eyebrow">First Species Counterpoint</p>
      <h1>第一種2声対位法チェッカー</h1>
      <p class="lead">
        五線譜をクリックして対旋律を入力します。↑で半音上行、↓で半音下行、← / → で前後の音へ移動します。
        スペースキーで定旋律と対旋律を同時に再生・停止できます。
      </p>
    </header>

    <section class="checker-panel">
      <textarea id="cantus" class="hidden-input">C4 D4 E4 F4 G4 F4 E4 D4 C4</textarea>
      <textarea id="counterpoint" class="hidden-input"></textarea>

      <div class="exercise-tools">
        <label class="exercise-control" for="levelFilterSelect">
          <span data-i18n="levelFilterLabel">レベル</span>
          <select id="levelFilterSelect">
            <option value="all" data-i18n="levelAll">すべて</option>
            <option value="beginner" data-i18n="levelBeginner">初級</option>
            <option value="intermediate" data-i18n="levelIntermediate">中級</option>
            <option value="advanced" data-i18n="levelAdvanced">上級</option>
          </select>
        </label>

        <label class="exercise-control" for="exerciseSelect">
          <span data-i18n="exerciseLabel">課題</span>
          <select id="exerciseSelect"></select>
        </label>

        <button class="button small" type="button" onclick="loadSelectedExercise()" data-i18n="loadExercise">
          課題を読み込む
        </button>

        <p class="exercise-description" id="exerciseDescription">
          課題を選択してください。
        </p>
      </div>

      <div class="score-tools">
        <button class="button small" type="button" onclick="setExample()">
          例題を読み込む
        </button>

        <button class="button small" type="button" onclick="undoCounterpointNote()">
          最後の音を削除
        </button>

        <button class="button small" type="button" onclick="clearCounterpoint()">
          対旋律をクリア
        </button>

        <button class="button small" type="button" onclick="renderScore()">
          楽譜を更新
        </button>

        <button class="button small" type="button" onclick="playSelectedNote()">
          選択音を鳴らす
        </button>
      </div>

      <div class="playback-tools">
        <button id="playPauseButton" class="button primary" type="button" onclick="togglePlayback()">
          再生
        </button>

        <button class="button small" type="button" onclick="stopPlayback(true)">
          最初に戻す
        </button>

        <label class="tempo-control" for="tempoInput">
          Tempo
          <input id="tempoInput" type="number" min="40" max="180" value="72" />
        </label>

        <label class="timbre-control" for="timbreSelect">
          音色
          <select id="timbreSelect" onchange="previewTimbre()">
            <option value="sine">Sine / 柔らかい</option>
            <option value="triangle" selected>Triangle / 素直</option>
            <option value="square">Square / 電子的</option>
            <option value="sawtooth">Sawtooth / 明るい</option>
            <option value="organ">Organ / オルガン風</option>
            <option value="bell">Bell / ベル風</option>
          </select>
        </label>

        <p class="playback-hint">
          Space：再生 / 停止　｜　← / →：前後の音へ移動
        </p>
      </div>

      <div class="score-box">
        <div class="score-head">
          <div>
            <h2>五線入力</h2>
            <p>
              五線をクリックして音を置きます。置いた音は青色で選択され、↑↓で半音移動、←→で前後の音へ移動できます。
            </p>
          </div>
          <div class="score-status" id="scoreStatus">
            対旋律：0音
          </div>
        </div>

        <svg
          id="scoreEditor"
          class="score-editor"
          viewBox="0 0 960 300"
          role="img"
          aria-label="対位法入力用五線譜"
          tabindex="0"
        ></svg>
      </div>

      <div class="current-notes">
        <h2>現在の入力</h2>
        <p><strong>定旋律：</strong><span id="cantusDisplay"></span></p>
        <p><strong>対旋律：</strong><span id="counterpointDisplay"></span></p>
      </div>

      <button class="button primary" onclick="analyzeCounterpoint()">
        解析する
      </button>
    </section>

    <section class="result-section">
      <h2>解析結果</h2>
      <div id="summary" class="summary-box">
        まだ解析していません。
      </div>
      <div id="result" class="result-list"></div>
    </section>
  </main>

  <script src="js/counterpoint.js"></script>
</body>
</html>
