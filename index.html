<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>2声対位法トレーナー｜Atelier Composition Son</title>
  <meta name="description" content="第一種2声対位法を学習するためのオンライン練習ページです。" />

  <link rel="stylesheet" href="css/style.css" />
</head>

<body>
  <main class="page">
    <section class="hero">
      <p class="eyebrow">Atelier Composition Son</p>
      <h1>2声対位法トレーナー</h1>
      <p class="lead">
        第一種対位法、1音対1音の基礎を練習するためのオンライン教材です。
        定旋律と対旋律を入力すると、協和音程や連続5度・連続8度を確認できます。
      </p>

      <div class="actions">
        <a class="button primary" href="counterpoint-checker.html">
          第一種対位法チェッカーを開く
        </a>
      </div>
    </section>

    <section class="cards">
      <article class="card">
        <h2>学習内容</h2>
        <ul>
          <li>定旋律と対旋律</li>
          <li>協和音程と不協和音程</li>
          <li>連続5度・連続8度</li>
          <li>開始と終止の確認</li>
        </ul>
      </article>

      <article class="card">
        <h2>入力形式</h2>
        <p>
          音名は半角英字で入力します。
        </p>
        <pre>C4 D4 E4 F4 G4 F4 E4 D4 C4</pre>
      </article>

      <article class="card">
        <h2>対象</h2>
        <p>
          作曲、和声、対位法を学び始めた方、または受験準備として基礎を確認したい方向けです。
        </p>
      </article>
    </section>
  </main>
</body>
</html>
